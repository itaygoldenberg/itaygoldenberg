<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="104" viewBox="0 0 1200 104" role="img" aria-label="Build, learn, refine, ship">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2dd4bf"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#7dd3fc" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="102" rx="14"/></clipPath>
  </defs>
  <rect x="1" y="1" width="1198" height="102" rx="14" fill="#071321" stroke="#203047" />
  <rect x="1" y="1" width="1198" height="102" rx="14" fill="none" stroke="url(#g)" stroke-width="1.5" stroke-dasharray="42 34" opacity=".65"><animate attributeName="stroke-dashoffset" values="0;-304" dur="9s" repeatCount="indefinite"/></rect>
  <g clip-path="url(#clip)"><rect x="-180" y="1" width="130" height="102" fill="url(#scan)" transform="skewX(-18)"><animate attributeName="x" values="-180;1400" dur="7s" repeatCount="indefinite"/></rect></g>
  <path id="route" d="M68 53 H420 C470 53 468 23 518 23 H682 C732 23 730 53 780 53 H1132" fill="none" stroke="#263a51" stroke-width="2" />
  <path d="M68 53 H420 C470 53 468 23 518 23 H682 C732 23 730 53 780 53 H1132" fill="none" stroke="url(#g)" stroke-width="2.5" stroke-dasharray="11 27"><animate attributeName="stroke-dashoffset" values="0;-152" dur="3.3s" repeatCount="indefinite"/></path>
  <circle r="5" fill="#ffffff" filter="url(#glow)"><animateMotion dur="5.5s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
  <rect x="407" y="20" width="386" height="64" rx="9" fill="#0a1828" stroke="#2c4864" />
  <path d="M426 31H774" stroke="url(#g)" stroke-width="2" stroke-dasharray="70 278"><animate attributeName="stroke-dashoffset" values="70;-348" dur="4.5s" repeatCount="indefinite"/></path>
  <text x="600" y="50" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="800">BUILD  /  LEARN  /  REFINE  /  SHIP</text>
  <text x="600" y="69" text-anchor="middle" fill="#7f91aa" font-family="Segoe UI,Arial,sans-serif" font-size="10">ONE THOUGHTFUL RELEASE AT A TIME</text>
  <circle cx="68" cy="53" r="4" fill="#2dd4bf" filter="url(#glow)"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="1132" cy="53" r="4" fill="#8b5cf6" filter="url(#glow)"><animate attributeName="r" values="4;7;4" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
  <g fill="#38bdf8">
    <circle cx="236" cy="53" r="2"><animate attributeName="opacity" values=".15;1;.15" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="964" cy="53" r="2"><animate attributeName="opacity" values=".15;1;.15" dur="2.4s" begin=".8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
