<svg xmlns="http://www.w3.org/2000/svg" width="560" height="245" viewBox="0 0 560 245" role="img" aria-label="Clothing Store Inventory Manager project">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f59e0b"/><stop offset=".5" stop-color="#ec4899"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="icon" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#9a3412"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#f9a8d4" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect x="1.5" y="1.5" width="557" height="242" rx="16"/></clipPath>
  </defs>
  <rect x="1.5" y="1.5" width="557" height="242" rx="16" fill="#0a1321" stroke="url(#border)" stroke-width="2" />
  <g clip-path="url(#clip)"><rect x="-130" y="2" width="96" height="240" fill="url(#scan)" transform="skewX(-14)"><animate attributeName="x" values="-130;700" dur="6.8s" begin="1.4s" repeatCount="indefinite"/></rect></g>
  <rect x="2.5" y="2.5" width="555" height="240" rx="15" fill="none" stroke="url(#border)" stroke-width="1" stroke-dasharray="20 28" opacity=".5"><animate attributeName="stroke-dashoffset" values="0;-192" dur="7.6s" repeatCount="indefinite"/></rect>
  <path d="M24 18 H536" stroke="#20364d" stroke-width="2" />
  <path d="M24 18 H536" stroke="url(#border)" stroke-width="2" stroke-dasharray="512" stroke-dashoffset="512"><animate attributeName="stroke-dashoffset" values="512;0;0" keyTimes="0;.72;1" dur="5.4s" repeatCount="indefinite"/></path>
  <rect x="30" y="38" width="68" height="68" rx="12" fill="url(#icon)"><animate attributeName="opacity" values=".78;1;.78" dur="3.3s" repeatCount="indefinite"/></rect>
  <path d="M64 53c0 5-8 5-8 0m8 0c0 7 16 7 16 16M64 53c0 7-16 7-16 16M48 69l-7 20h46l-7-20M51 69h26" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="118" y="58" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="800">Clothing Store</text>
  <text x="119" y="82" fill="#f9a8d4" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">INVENTORY MANAGER</text>
  <rect x="431" y="37" width="96" height="28" rx="7" fill="#0d2b28" stroke="#257366" />
  <circle cx="447" cy="51" r="4" fill="#34d399"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="460" y="55" fill="#8cf2d1" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="800">LIVE</text>
  <text x="30" y="139" fill="#dbe7f3" font-family="Segoe UI,Arial,sans-serif" font-size="15">A practical inventory tool for adding, updating, filtering</text>
  <text x="30" y="162" fill="#9fb0c5" font-family="Segoe UI,Arial,sans-serif" font-size="15">and tracking clothing stock through a focused interface.</text>
  <path d="M30 179H527" stroke="url(#border)" stroke-width="1" opacity=".22"/><circle cy="179" r="3" fill="#f9a8d4" filter="url(#glow)"><animate attributeName="cx" values="30;527;30" dur="6s" begin="1.2s" repeatCount="indefinite"/></circle>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">
    <rect x="30" y="192" width="100" height="28" rx="7" fill="#292114" stroke="#6d5821"/><text x="80" y="210" fill="#fde68a" text-anchor="middle">JAVASCRIPT</text>
    <rect x="140" y="192" width="72" height="28" rx="7" fill="#3a1c18" stroke="#86402f"/><text x="176" y="210" fill="#fdba74" text-anchor="middle">HTML</text>
    <rect x="222" y="192" width="66" height="28" rx="7" fill="#102848" stroke="#285b92"/><text x="255" y="210" fill="#93c5fd" text-anchor="middle">CSS</text>
  </g>
  <circle cx="517" cy="207" r="17" fill="#27162f" stroke="#7b3b84"><animate attributeName="r" values="16;18;16" dur="2.7s" repeatCount="indefinite"/><animate attributeName="stroke" values="#7b3b84;#f59e0b;#7b3b84" dur="3.9s" repeatCount="indefinite"/></circle><path d="M510 207h13m-5-5 5 5-5 5" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
