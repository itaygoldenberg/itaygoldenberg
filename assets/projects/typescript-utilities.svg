<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="Four TypeScript utilities published in September 2026">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071522"/>
      <stop offset="1" stop-color="#17112b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2dd4bf"/>
      <stop offset="0.48" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7dd3fc" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="1.5" y="1.5" width="717" height="297" rx="18"/></clipPath>
  </defs>

  <rect x="1.5" y="1.5" width="717" height="297" rx="18" fill="url(#background)" stroke="url(#accent)" stroke-width="2"/>
  <g clip-path="url(#frame)">
    <rect x="-180" y="2" width="120" height="296" fill="url(#scan)" transform="skewX(-15)">
      <animate attributeName="x" values="-180;900" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="2.5" y="2.5" width="715" height="295" rx="17" fill="none" stroke="url(#accent)" stroke-width="1" stroke-dasharray="28 34" opacity="0.55">
    <animate attributeName="stroke-dashoffset" values="0;-248" dur="8s" repeatCount="indefinite"/>
  </rect>

  <g font-family="Segoe UI,Inter,Arial,sans-serif">
    <rect x="28" y="24" width="134" height="27" rx="7" fill="#0d2926" stroke="#286b61"/>
    <circle cx="43" cy="37.5" r="4" fill="#34d399" filter="url(#glow)">
      <animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="56" y="42" fill="#8cf2d1" font-size="11" font-weight="800">SEPTEMBER 2026</text>

    <text x="28" y="82" fill="#f8fafc" font-size="28" font-weight="800">TypeScript Utility Toolkit</text>
    <text x="29" y="105" fill="#8acff0" font-size="12" font-weight="700">FOUR SMALL PACKAGES · ONE PRACTICAL TOOLKIT</text>

    <g transform="translate(28 128)">
      <rect width="318" height="58" rx="11" fill="#0d2530" stroke="#1d5e78"/>
      <text x="18" y="25" fill="#7dd3fc" font-size="15" font-weight="800">itay-singleton</text>
      <text x="18" y="44" fill="#9fb0c5" font-size="12">Generate singleton class files</text>
      <path d="M282 20h17m-6-6 6 6-6 6" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(374 128)">
      <rect width="318" height="58" rx="11" fill="#181a37" stroke="#554687"/>
      <text x="18" y="25" fill="#c4b5fd" font-size="15" font-weight="800">itay-random-color</text>
      <text x="18" y="44" fill="#a9abc2" font-size="12">Return valid six-digit hex colors</text>
      <circle cx="290" cy="20" r="9" fill="#8b5cf6" filter="url(#glow)">
        <animate attributeName="fill" values="#8b5cf6;#22d3ee;#34d399;#8b5cf6" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g transform="translate(28 198)">
      <rect width="318" height="58" rx="11" fill="#211824" stroke="#713d57"/>
      <text x="18" y="25" fill="#fb7185" font-size="15" font-weight="800">itay-color-printer</text>
      <text x="18" y="44" fill="#bca5af" font-size="12">Typed terminal output in four colors</text>
      <g transform="translate(274 14)">
        <circle cx="0" cy="0" r="4" fill="#fb7185"/><circle cx="14" cy="0" r="4" fill="#34d399"/>
        <circle cx="0" cy="14" r="4" fill="#38bdf8"/><circle cx="14" cy="14" r="4" fill="#fbbf24"/>
      </g>
    </g>
    <g transform="translate(374 198)">
      <rect width="318" height="58" rx="11" fill="#241d13" stroke="#765424"/>
      <text x="18" y="25" fill="#fbbf24" font-size="15" font-weight="800">itay-time-art</text>
      <text x="18" y="44" fill="#bdb09a" font-size="12">Render local date and time as ASCII</text>
      <circle cx="289" cy="29" r="13" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <path d="M289 20v9l6 4" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    </g>

    <g transform="translate(28 272)" font-size="10" font-weight="800">
      <text fill="#72dfd1">TYPESCRIPT</text>
      <text x="82" fill="#7dd3fc">NODE.JS</text>
      <text x="143" fill="#c4b5fd">NPM</text>
      <text x="181" fill="#fbbf24">CLI + LIBRARIES</text>
    </g>
  </g>
</svg>
