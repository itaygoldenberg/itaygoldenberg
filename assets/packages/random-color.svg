  <rect x="2.5" y="2.5" width="555" height="227" rx="15" fill="none" stroke="url(#border)" stroke-width="1" stroke-dasharray="20 28" opacity=".5"><animate attributeName="stroke-dashoffset" values="0;-192" dur="7.4s" repeatCount="indefinite"/></rect>
  <path d="M24 18 H536" stroke="#3a2230" stroke-width="2"/>
