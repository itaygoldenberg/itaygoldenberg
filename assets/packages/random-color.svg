<svg xmlns="http://www.w3.org/2000/svg" width="560" height="232" viewBox="0 0 560 232" role="img" aria-label="itay-random-color on npm">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f87171"/><stop offset=".55" stop-color="#fb923c"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="icon" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#3f1014"/><stop offset="1" stop-color="#2a1533"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fca5a5" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
