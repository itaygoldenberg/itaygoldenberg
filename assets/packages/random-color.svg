  <text x="119" y="82" fill="#fca5a5" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">LIBRARY &#183; PUBLISHED ON NPM</text>
  <rect x="447" y="35" width="80" height="28" rx="7" fill="#2a1114" stroke="#7a2f36"/>
  <text x="487" y="53" fill="#f7b3b8" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" text-anchor="middle">v1.0.2</text>
  <text x="30" y="136" fill="#e7dbe3" font-family="Segoe UI,Arial,sans-serif" font-size="15">Returns a random colour on every call. Used inside my own</text>
  <text x="30" y="158" fill="#b3a2ae" font-family="Segoe UI,Arial,sans-serif" font-size="15">React project to tint product cards at runtime.</text>
  <path d="M30 174H527" stroke="url(#border)" stroke-width="1" opacity=".22"/><circle cy="174" r="3" fill="#fca5a5" filter="url(#glow)"><animate attributeName="cx" values="30;527;30" dur="5.8s" begin=".4s" repeatCount="indefinite"/></circle>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">
    <rect x="30" y="188" width="82" height="28" rx="7" fill="#2a1114" stroke="#7a2f36"/><text x="71" y="206" fill="#f7b3b8" text-anchor="middle">NODE.JS</text>
