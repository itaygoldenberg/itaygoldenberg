<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Interface engineering, application architecture, and API data capabilities">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06131f" />
      <stop offset="0.58" stop-color="#091526" />
      <stop offset="1" stop-color="#12122c" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2dd4bf" />
      <stop offset="0.52" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#7dd3fc" stop-opacity="0.11" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="258" rx="16" /></clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="258" rx="16" fill="url(#panel)" stroke="#21344c" stroke-width="2" />
  <rect x="1" y="1" width="1198" height="258" rx="16" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="56 720" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="56;-1450" dur="9s" repeatCount="indefinite" />
  </rect>
  <g clip-path="url(#frame)">
    <path d="M-50 225 C150 166 266 248 438 188 S730 120 890 177 S1080 219 1250 134" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.08" />
    <rect x="-240" y="1" width="180" height="258" fill="url(#scan)" transform="skewX(-17)">
      <animate attributeName="x" values="-240;1400" dur="8s" repeatCount="indefinite" />
    </rect>
  </g>

  <text x="38" y="35" fill="#7dd3fc" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="800">CAPABILITY MATRIX</text>
  <text x="1162" y="35" text-anchor="end" fill="#718399" font-family="Consolas,monospace" font-size="11">INTERFACE / SYSTEMS / DATA</text>

  <g transform="translate(38 55)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="350" height="170" rx="10" fill="#081c29" stroke="#1d5368" />
    <rect width="350" height="3" rx="1.5" fill="#2dd4bf" />
    <circle cx="47" cy="48" r="27" fill="#0a2a31" stroke="#277268" stroke-width="2" />
    <circle cx="47" cy="48" r="20" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="11 8">
      <animateTransform attributeName="transform" type="rotate" values="0 47 48;360 47 48" dur="9s" repeatCount="indefinite" />
    </circle>
    <path d="M34 54V39h25v15M38 50l6-6 5 4 7-9" fill="none" stroke="#8cf2e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="86" y="39" fill="#6ee7d7" font-size="12" font-weight="800">01 / INTERFACE</text>
    <text x="86" y="62" fill="#f8fafc" font-size="20" font-weight="800">Interface engineering</text>
    <text x="24" y="101" fill="#a8b8ce" font-size="14">Responsive React experiences, reusable components</text>
    <text x="24" y="122" fill="#a8b8ce" font-size="14">and deliberate interaction design.</text>
    <g transform="translate(24 140)" font-size="10" font-weight="800">
      <rect width="72" height="20" rx="6" fill="#0b2934" stroke="#1d6172" /><text x="36" y="14" text-anchor="middle" fill="#7dd3fc">REACT UI</text>
      <rect x="82" width="94" height="20" rx="6" fill="#0b2934" stroke="#1d6172" /><text x="129" y="14" text-anchor="middle" fill="#7dd3fc">RESPONSIVE</text>
      <rect x="186" width="112" height="20" rx="6" fill="#0b2934" stroke="#1d6172" /><text x="242" y="14" text-anchor="middle" fill="#7dd3fc">ACCESSIBILITY</text>
    </g>
  </g>

  <g transform="translate(425 55)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="350" height="170" rx="10" fill="#0b182b" stroke="#3d4f82" />
    <rect width="350" height="3" rx="1.5" fill="#60a5fa" />
    <circle cx="47" cy="48" r="27" fill="#101f3a" stroke="#465e9a" stroke-width="2" />
    <circle cx="47" cy="48" r="20" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="11 8">
      <animateTransform attributeName="transform" type="rotate" values="0 47 48;-360 47 48" dur="9s" repeatCount="indefinite" />
    </circle>
    <path d="M35 40h9v9h-9zM50 40h9v9h-9zM42.5 55h9v9h-9zM44 44.5h6M47 49v6" fill="none" stroke="#b7c8ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="86" y="39" fill="#93b4ff" font-size="12" font-weight="800">02 / SYSTEMS</text>
    <text x="86" y="62" fill="#f8fafc" font-size="20" font-weight="800">Application architecture</text>
    <text x="24" y="101" fill="#a8b8ce" font-size="14">Typed models, routing, global state and clean</text>
    <text x="24" y="122" fill="#a8b8ce" font-size="14">boundaries between UI and services.</text>
    <g transform="translate(24 140)" font-size="10" font-weight="800">
      <rect width="88" height="20" rx="6" fill="#111d36" stroke="#3a4f83" /><text x="44" y="14" text-anchor="middle" fill="#b7c8ff">TYPESCRIPT</text>
      <rect x="98" width="72" height="20" rx="6" fill="#111d36" stroke="#3a4f83" /><text x="134" y="14" text-anchor="middle" fill="#b7c8ff">REDUX</text>
      <rect x="180" width="76" height="20" rx="6" fill="#111d36" stroke="#3a4f83" /><text x="218" y="14" text-anchor="middle" fill="#b7c8ff">ROUTING</text>
    </g>
  </g>

  <g transform="translate(812 55)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="350" height="170" rx="10" fill="#11162b" stroke="#58477f" />
    <rect width="350" height="3" rx="1.5" fill="#8b5cf6" />
    <circle cx="47" cy="48" r="27" fill="#191934" stroke="#624b91" stroke-width="2" />
    <circle cx="47" cy="48" r="20" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="11 8">
      <animateTransform attributeName="transform" type="rotate" values="0 47 48;360 47 48" dur="9s" repeatCount="indefinite" />
    </circle>
    <ellipse cx="47" cy="40" rx="12" ry="5" fill="none" stroke="#dacbff" stroke-width="2.2" />
    <path d="M35 40v15c0 3 5 5 12 5s12-2 12-5V40M35 47c0 3 5 5 12 5s12-2 12-5" fill="none" stroke="#dacbff" stroke-width="2.2" />
    <text x="86" y="39" fill="#c4b5fd" font-size="12" font-weight="800">03 / DATA</text>
    <text x="86" y="62" fill="#f8fafc" font-size="20" font-weight="800">APIs and data</text>
    <text x="24" y="101" fill="#a8b8ce" font-size="14">REST integrations, real-time streams, Express</text>
    <text x="24" y="122" fill="#a8b8ce" font-size="14">services and MySQL workflows.</text>
    <g transform="translate(24 140)" font-size="10" font-weight="800">
      <rect width="58" height="20" rx="6" fill="#1a1833" stroke="#57457e" /><text x="29" y="14" text-anchor="middle" fill="#d8ccff">REST</text>
      <rect x="68" width="92" height="20" rx="6" fill="#1a1833" stroke="#57457e" /><text x="114" y="14" text-anchor="middle" fill="#d8ccff">REAL TIME</text>
      <rect x="170" width="68" height="20" rx="6" fill="#1a1833" stroke="#57457e" /><text x="204" y="14" text-anchor="middle" fill="#d8ccff">MYSQL</text>
    </g>
  </g>

  <g fill="#ffffff" filter="url(#glow)">
    <circle r="3"><animateMotion dur="7s" repeatCount="indefinite" path="M38 55H1162" /></circle>
  </g>
</svg>
