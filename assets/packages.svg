<svg xmlns="http://www.w3.org/2000/svg" width="560" height="508" viewBox="0 0 560 508" role="img" aria-label="Published npm packages: itay-time-art, itay-color-printer, itay-random-color">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset=".55" stop-color="#091525"/><stop offset="1" stop-color="#11122a"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2dd4bf"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#7dd3fc" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#38bdf8" stop-opacity=".18"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect x="1" y="1" width="558" height="506" rx="16"/></clipPath>
  </defs>

  <rect x="1" y="1" width="558" height="506" rx="16" fill="url(#panel)" stroke="#22364e" stroke-width="2"/>
  <rect x="1" y="1" width="558" height="506" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.5" stroke-dasharray="50 34" opacity=".62"><animate attributeName="stroke-dashoffset" values="0;-336" dur="10s" repeatCount="indefinite"/></rect>
  <g clip-path="url(#clip)">
    <rect x="-230" y="1" width="170" height="506" fill="url(#scan)" transform="skewX(-16)"><animate attributeName="x" values="-230;760" dur="8.5s" repeatCount="indefinite"/></rect>
  </g>

  <text x="30" y="34" fill="#7dd3fc" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2">PUBLISHED PACKAGES</text>
  <text x="530" y="34" fill="#718399" font-family="Consolas,monospace" font-size="10" text-anchor="end">REGISTRY.NPMJS.ORG</text>
  <path d="M30 46H530" stroke="#22364e"/>
  <path d="M30 46H530" stroke="url(#edge)" stroke-width="2" stroke-dasharray="90 410"><animate attributeName="stroke-dashoffset" values="90;-500" dur="6s" repeatCount="indefinite"/></path>

  <g transform="translate(0 62)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="16" width="528" height="132" rx="12" fill="#0a1826" stroke="#28526b"><animate attributeName="stroke-opacity" values=".45;1;.45" dur="3.4s" begin="0s" repeatCount="indefinite"/></rect>
    <circle cx="52" cy="40" r="20" fill="url(#halo)"/><image href="data:image/svg+xml;base64," x="38" y="28" width="28" height="28"/>
    <text x="80" y="38" fill="#f8fafc" font-size="17" font-weight="800">itay-time-art</text>
    <text x="80" y="56" fill="#7890a8" font-size="10" font-weight="700">CLI &#183; PUBLISHED ON NPM</text>
    <rect x="452" y="24" width="76" height="24" rx="6" fill="#231016" stroke="#7a2d34"/>
    <text x="490" y="40" fill="#f4a4ab" font-size="10" font-weight="800" text-anchor="middle">v1.0.6</text>
    <text x="30" y="72" fill="#a8b8ce" font-size="12">Prints the current time as ASCII art in the</text>
    <text x="30" y="88" fill="#a8b8ce" font-size="12">terminal. Installed globally, run as a command.</text>
    <rect x="30" y="94" width="84" height="24" rx="6" fill="#111a2c" stroke="#2c4a6b"/><text x="72" y="110" fill="#9ec6e8" font-size="10" font-weight="700" text-anchor="middle">NODE.JS</text><rect x="122" y="94" width="84" height="24" rx="6" fill="#111a2c" stroke="#2c4a6b"/><text x="164" y="110" fill="#9ec6e8" font-size="10" font-weight="700" text-anchor="middle">TYPESCRIPT</text><rect x="214" y="94" width="84" height="24" rx="6" fill="#111a2c" stroke="#2c4a6b"/><text x="256" y="110" fill="#9ec6e8" font-size="10" font-weight="700" text-anchor="middle">BIN</text>
  </g>
  <g transform="translate(0 208)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="16" width="528" height="132" rx="12" fill="#0a1826" stroke="#28526b"><animate attributeName="stroke-opacity" values=".45;1;.45" dur="3.4s" begin="0.5s" repeatCount="indefinite"/></rect>
    <circle cx="52" cy="40" r="20" fill="url(#halo)"/><image href="data:image/svg+xml;base64," x="38" y="28" width="28" height="28"/>
    <text x="80" y="38" fill="#f8fafc" font-size="17" font-weight="800">itay-color-printer</text>
    <text x="80" y="56" fill="#7890a8" font-size="10" font-weight="700">LIBRARY &#183; PUBLISHED ON NPM</text>
    <rect x="452" y="24" width="76" height="24" rx="6" fill="#231016" stroke="#7a2d34"/>
    <text x="490" y="40" fill="#f4a4ab" font-size="10" font-weight="800" text-anchor="middle">v1.0.3</text>
    <text x="30" y="72" fill="#a8b8ce" font-size="12">Console printer that writes in colour. Imported</text>
    <text x="30" y="88" fill="#a8b8ce" font-size="12">by other projects and typed for TypeScript.</text>
    <rect x="30" y="94" width="84" height="24" rx="6" fill="#111a2c" stroke="#2c4a6b"/><text x="72" y="110" fill="#9ec6e8" font-size="10" font-weight="700" text-anchor="middle">NODE.JS</text><rect x="122" y="94" width="84" height="24" rx="6" fill="#111a2c" stroke="#2c4a6b"/><text x="164" y="110" fill="#9ec6e8" font-size="10" font-weight="700" text-anchor="middle">TYPESCRIPT</text><rect x="214" y="94" width="84" height="24" rx="6" fill="#111a2c" stroke="#2c4a6b"/><text x="256" y="110" fill="#9ec6e8" font-size="10" font-weight="700" text-anchor="middle">TYPES</text>
  </g>
  <g transform="translate(0 354)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="16" width="528" height="132" rx="12" fill="#0a1826" stroke="#28526b"><animate attributeName="stroke-opacity" values=".45;1;.45" dur="3.4s" begin="1s" repeatCount="indefinite"/></rect>
    <circle cx="52" cy="40" r="20" fill="url(#halo)"/><image href="data:image/svg+xml;base64," x="38" y="28" width="28" height="28"/>
    <text x="80" y="38" fill="#f8fafc" font-size="17" font-weight="800">itay-random-color</text>
    <text x="80" y="56" fill="#7890a8" font-size="10" font-weight="700">LIBRARY &#183; PUBLISHED ON NPM</text>
    <rect x="452" y="24" width="76" height="24" rx="6" fill="#231016" stroke="#7a2d34"/>
    <text x="490" y="40" fill="#f4a4ab" font-size="10" font-weight="800" text-anchor="middle">v1.0.2</text>
    <text x="30" y="72" fill="#a8b8ce" font-size="12">Returns a random colour. Used inside my own</text>
    <text x="30" y="88" fill="#a8b8ce" font-size="12">React project to tint product cards at runtime.</text>
    <rect x="30" y="94" width="84" height="24" rx="6" fill="#111a2c" stroke="#2c4a6b"/><text x="72" y="110" fill="#9ec6e8" font-size="10" font-weight="700" text-anchor="middle">NODE.JS</text><rect x="122" y="94" width="84" height="24" rx="6" fill="#111a2c" stroke="#2c4a6b"/><text x="164" y="110" fill="#9ec6e8" font-size="10" font-weight="700" text-anchor="middle">TYPESCRIPT</text><rect x="214" y="94" width="84" height="24" rx="6" fill="#111a2c" stroke="#2c4a6b"/><text x="256" y="110" fill="#9ec6e8" font-size="10" font-weight="700" text-anchor="middle">REACT</text>
  </g>

  <circle cx="22" cy="46" r="3" fill="#2dd4bf" filter="url(#glow)"><animate attributeName="cx" values="22;538;22" dur="6s" repeatCount="indefinite"/></circle>
</svg>
