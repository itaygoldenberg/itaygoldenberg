<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Itay Goldenberg, Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.55" stop-color="#0b1426" />
      <stop offset="1" stop-color="#11122b" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d9d0" />
      <stop offset="0.52" stop-color="#4db8ff" />
      <stop offset="1" stop-color="#8b72ff" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#20c997" />
      <stop offset="0.55" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="358" rx="18" /></clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="18" fill="url(#bg)" stroke="url(#accent)" stroke-width="2" />
  <g clip-path="url(#frame)" opacity="0.16" fill="none" stroke="#69a6d8">
    <path d="M-30 280 C120 245 190 300 330 250 S550 180 690 230 S920 300 1240 155" />
    <path d="M-30 315 C125 282 205 330 350 286 S570 215 720 265 S960 322 1240 208" opacity="0.45" />
  </g>

  <g transform="translate(72 54)">
    <rect width="150" height="30" rx="6" fill="#0e2530" stroke="#1d685f" />
    <circle cx="17" cy="15" r="4" fill="#2dd4bf">
      <animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="31" y="20" fill="#8cf2e5" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">DEVELOPER PROFILE</text>
  </g>

  <text x="72" y="132" fill="#f8fafc" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="50" font-weight="800">Itay Goldenberg</text>
  <text x="74" y="173" fill="url(#accent)" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="25" font-weight="700">Full Stack Developer</text>
  <text x="74" y="211" fill="#a8b8ce" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="17">Building polished interfaces, reliable data flows and complete web products.</text>

  <g transform="translate(74 246)" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">
    <rect width="142" height="34" rx="7" fill="#0c2331" stroke="#1d5e78" />
    <text x="71" y="22" fill="#7dd3fc" text-anchor="middle">REACT + TYPESCRIPT</text>
    <rect x="154" width="126" height="34" rx="7" fill="#151b38" stroke="#4d427e" />
    <text x="217" y="22" fill="#c4b5fd" text-anchor="middle">NODE + EXPRESS</text>
    <rect x="292" width="116" height="34" rx="7" fill="#0f2824" stroke="#27685c" />
    <text x="350" y="22" fill="#86efac" text-anchor="middle">PRODUCT UI</text>
  </g>

  <g transform="translate(710 53)">
    <rect x="0" y="0" width="410" height="252" rx="14" fill="#081321" stroke="#203653" />
    <circle cx="22" cy="21" r="4" fill="#fb7185" /><circle cx="38" cy="21" r="4" fill="#fbbf24" /><circle cx="54" cy="21" r="4" fill="#34d399" />
    <text x="84" y="25" fill="#7f91aa" font-family="Consolas,monospace" font-size="12">portfolio.flow</text>

    <path id="flowPath" d="M30 190 C82 158 108 196 154 141 S244 64 294 110 S350 174 382 74" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" stroke-dasharray="620" stroke-dashoffset="620">
      <animate attributeName="stroke-dashoffset" values="620;0;0" keyTimes="0;.72;1" dur="5s" repeatCount="indefinite" />
    </path>
    <path d="M30 190 C82 158 108 196 154 141 S244 64 294 110 S350 174 382 74 L382 220 L30 220 Z" fill="#38bdf8" opacity="0.06" />
    <g fill="#081321" stroke="#60d9ff" stroke-width="3">
      <circle cx="30" cy="190" r="7" /><circle cx="154" cy="141" r="7" /><circle cx="294" cy="110" r="7" /><circle cx="382" cy="74" r="7" />
    </g>
    <circle r="6" fill="#ffffff" filter="url(#glow)">
      <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#flowPath" /></animateMotion>
    </circle>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">
      <text x="19" y="214" fill="#72dfd1">IDEA</text><text x="134" y="165" fill="#7dd3fc">BUILD</text><text x="274" y="134" fill="#a78bfa">REFINE</text><text x="359" y="57" fill="#86efac">SHIP</text>
    </g>
  </g>

  <rect x="72" y="310" width="470" height="2" rx="1" fill="url(#accent)">
    <animate attributeName="width" values="0;470;470" keyTimes="0;.7;1" dur="3.8s" repeatCount="indefinite" />
  </rect>
  <text x="1120" y="334" fill="#596b84" font-family="Consolas,monospace" font-size="11" text-anchor="end">ISRAEL / WEB ENGINEERING</text>
</svg>
