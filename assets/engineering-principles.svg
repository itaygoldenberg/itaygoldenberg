<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="238" viewBox="0 0 1200 238" role="img" aria-label="Engineering principles: clarity, accessibility, secure boundaries, and complete verification">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06131f" />
      <stop offset="0.56" stop-color="#091526" />
      <stop offset="1" stop-color="#12122c" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2dd4bf" />
      <stop offset="0.5" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#7dd3fc" stop-opacity="0.1" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="236" rx="16" /></clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="236" rx="16" fill="url(#panel)" stroke="#21344c" stroke-width="2" />
  <rect x="1" y="1" width="1198" height="236" rx="16" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="48 34" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-328" dur="10s" repeatCount="indefinite" />
  </rect>
  <g clip-path="url(#clip)">
    <rect x="-220" y="1" width="170" height="236" fill="url(#scan)" transform="skewX(-17)">
      <animate attributeName="x" values="-220;1400" dur="8.5s" repeatCount="indefinite" />
    </rect>
    <path d="M-30 205 C170 140 290 222 452 171 S750 105 922 164 S1088 194 1230 118" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.07" />
  </g>

  <text x="38" y="35" fill="#7dd3fc" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="800">ENGINEERING OPERATING SYSTEM</text>
  <text x="1162" y="35" text-anchor="end" fill="#718399" font-family="Consolas,monospace" font-size="11">CLEAR / INCLUSIVE / SECURE / VERIFIED</text>

  <g transform="translate(38 57)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="267" height="145" rx="10" fill="#081c29" stroke="#1d5368" />
    <path d="M1 32V10a9 9 0 0 1 9-9h65" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" />
    <text x="224" y="43" fill="#123142" font-size="43" font-weight="800">01</text>
    <circle cx="35" cy="39" r="19" fill="#0a2930" stroke="#277268" />
    <path d="M26 39l6 6 12-14M25 31h6M39 48h6" fill="none" stroke="#8cf2e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="24" y="79" fill="#f8fafc" font-size="18" font-weight="800">Clear by default</text>
    <text x="24" y="103" fill="#9fb1c7" font-size="13">Readable code, focused components</text>
    <text x="24" y="122" fill="#9fb1c7" font-size="13">and predictable data flow.</text>
    <circle cx="243" cy="121" r="3" fill="#2dd4bf" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite" /></circle>
  </g>

  <g transform="translate(323 57)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="267" height="145" rx="10" fill="#091b2b" stroke="#25597a" />
    <path d="M1 32V10a9 9 0 0 1 9-9h65" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <text x="224" y="43" fill="#112c46" font-size="43" font-weight="800">02</text>
    <circle cx="35" cy="39" r="19" fill="#0c2638" stroke="#2b6486" />
    <path d="M27 45V31h16v14M27 35h16M31 39h3M38 39h2" fill="none" stroke="#9bdfff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="24" y="79" fill="#f8fafc" font-size="18" font-weight="800">Inclusive interfaces</text>
    <text x="24" y="103" fill="#9fb1c7" font-size="13">Responsive behavior and accessibility</text>
    <text x="24" y="122" fill="#9fb1c7" font-size="13">treated as product requirements.</text>
    <circle cx="243" cy="121" r="3" fill="#38bdf8" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="2s" begin=".4s" repeatCount="indefinite" /></circle>
  </g>

  <g transform="translate(608 57)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="267" height="145" rx="10" fill="#0d192d" stroke="#405287" />
    <path d="M1 32V10a9 9 0 0 1 9-9h65" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round" />
    <text x="224" y="43" fill="#202443" font-size="43" font-weight="800">03</text>
    <circle cx="35" cy="39" r="19" fill="#121f39" stroke="#4b5f99" />
    <path d="M27 37v-5a8 8 0 0 1 16 0v5M25 37h20v14H25zM35 42v4" fill="none" stroke="#b7c8ff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="24" y="79" fill="#f8fafc" font-size="18" font-weight="800">Secure boundaries</text>
    <text x="24" y="103" fill="#9fb1c7" font-size="13">Secrets stay outside browser bundles;</text>
    <text x="24" y="122" fill="#9fb1c7" font-size="13">external data stays behind services.</text>
    <circle cx="243" cy="121" r="3" fill="#818cf8" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="2s" begin=".8s" repeatCount="indefinite" /></circle>
  </g>

  <g transform="translate(893 57)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="269" height="145" rx="10" fill="#11162c" stroke="#58477f" />
    <path d="M1 32V10a9 9 0 0 1 9-9h65" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
    <text x="226" y="43" fill="#282044" font-size="43" font-weight="800">04</text>
    <circle cx="35" cy="39" r="19" fill="#191934" stroke="#624b91" />
    <path d="M25 39l7 7 14-16M28 29h14M28 51h14" fill="none" stroke="#dacbff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0 70;70 0;70 0" keyTimes="0;.45;1" dur="3.2s" repeatCount="indefinite" />
    </path>
    <text x="24" y="79" fill="#f8fafc" font-size="18" font-weight="800">Verified end to end</text>
    <text x="24" y="103" fill="#9fb1c7" font-size="13">Complete workflows checked from local</text>
    <text x="24" y="122" fill="#9fb1c7" font-size="13">development to production delivery.</text>
    <circle cx="245" cy="121" r="3" fill="#a78bfa" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="2s" begin="1.2s" repeatCount="indefinite" /></circle>
  </g>
</svg>
