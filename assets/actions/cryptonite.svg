  <circle cx="229" cy="32" r="9.5" fill="#0b2935" stroke="#2b7187"><animate attributeName="stroke" values="#2b7187;#5eead4;#2b7187" dur="3s" repeatCount="indefinite"/></circle>
  <path d="M225 32h8m-3-3 3 3-3 3" fill="none" stroke="#8cf2e5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
