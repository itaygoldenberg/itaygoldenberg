  <rect x="1" y="1" width="248" height="62" rx="11" fill="url(#bg)" stroke="#24556b" stroke-width="1.5"/>
  <rect x="1" y="1" width="248" height="62" rx="11" fill="none" stroke="url(#edge)" stroke-width="1.5" stroke-dasharray="76 544" opacity=".9"><animate attributeName="stroke-dashoffset" values="76;-544" dur="5.2s" repeatCount="indefinite"/></rect>
  <g clip-path="url(#clip)"><rect x="-72" y="1" width="54" height="62" fill="url(#scan)" transform="skewX(-16)"><animate attributeName="x" values="-72;300" dur="4.8s" repeatCount="indefinite"/></rect></g>
  <path d="M25 41V22h21v19" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
